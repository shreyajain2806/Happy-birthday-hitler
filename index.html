<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Allura&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:'Poppins',sans-serif;

overflow:hidden;

background:
linear-gradient(135deg,#F9FCFF,#EEF7FF,#FFFFFF);

position:relative;

}

/* Floating Glow */

body::before{

content:"";

position:absolute;

width:450px;

height:450px;

background:#DCEEFF;

border-radius:50%;

filter:blur(120px);

top:-120px;

left:-100px;

opacity:.7;

}

body::after{

content:"";

position:absolute;

width:350px;

height:350px;

background:#E9F5FF;

border-radius:50%;

filter:blur(120px);

bottom:-100px;

right:-100px;

opacity:.8;

}

.sparkle{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

box-shadow:0 0 12px white;

animation:float 6s infinite ease-in-out;

}

@keyframes float{

0%{

transform:translateY(0px);

opacity:.2;

}

50%{

transform:translateY(-25px);

opacity:1;

}

100%{

transform:translateY(0px);

opacity:.2;

}

}

.card{

position:relative;

z-index:2;

width:90%;

max-width:700px;

background:rgba(255,255,255,.55);

backdrop-filter:blur(18px);

border-radius:35px;

padding:45px;

box-shadow:

0 25px 60px rgba(0,0,0,.08);

text-align:center;

}

.penguin{

width:180px;

margin:auto;

display:block;

animation:updown 4s infinite;

}

@keyframes updown{

50%{

transform:translateY(-8px);

}

}

.small{

font-family:'Allura',cursive;

font-size:38px;

color:#3E6BA5;

margin-top:15px;

}

.big{

font-family:'Playfair Display',serif;

font-size:45px;

color:#23476A;

margin-top:10px;

}

.desc{

margin-top:18px;

font-size:15px;

color:#5F6F81;

line-height:1.8;

max-width:420px;

margin-left:auto;

margin-right:auto;

}
.button{

display:inline-flex;

align-items:center;

justify-content:center;

margin-top:35px;

padding:15px 38px;

border-radius:50px;

text-decoration:none;

font-size:16px;

font-weight:600;

color:white;

background:linear-gradient(135deg,#6FAEFF,#4A90E2);

box-shadow:0 12px 30px rgba(74,144,226,.25);

transition:.35s;

}

.button:hover{

transform:translateY(-4px);

box-shadow:0 18px 35px rgba(74,144,226,.35);

}

.button span{

margin-left:8px;

transition:.3s;

}

.button:hover span{

transform:translateX(6px);

}

.corner-gift{

position:absolute;

right:28px;

top:28px;

font-size:32px;

opacity:.9;

animation:gift 3s infinite;

}

@keyframes gift{

50%{

transform:rotate(-8deg) scale(1.08);

}

}

.footer{

margin-top:28px;

font-size:13px;

color:#7B8794;

font-style:italic;

}

</style>

</head>

<body>

<div class="sparkle" style="left:8%;top:12%;animation-delay:0s;"></div>
<div class="sparkle" style="left:20%;top:82%;animation-delay:1s;"></div>
<div class="sparkle" style="left:76%;top:20%;animation-delay:2s;"></div>
<div class="sparkle" style="left:90%;top:70%;animation-delay:3s;"></div>
<div class="sparkle" style="left:60%;top:8%;animation-delay:1.5s;"></div>

<div class="card">

<div class="corner-gift">🎁</div>

<img src="penguin.png" class="penguin">

<div class="small">
HEY CUTIEE 💙
</div>

<div class="big">
Your Moment Awaits
</div>

<p class="desc">
A little birthday surprise is waiting for you.
I hope it brings a smile to your face.
Ready?
</p>

<a href="page2.html" class="button">

Tap Me For More

<span>→</span>

</a>

<div class="footer">
Made especially for you ✨
</div>

</div>

</body>

</html>
