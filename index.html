<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#DFF6FF,#B8E8FC);
    padding:20px;
}

.card{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(10px);
    border-radius:35px;
    padding:40px 20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.penguin{
    width:220px;
    max-width:80%;
    margin-bottom:20px;
}

.title{
    font-family:'Dancing Script',cursive;
    font-size:2rem;
    color:#2563EB;
    margin-bottom:20px;
    white-space:nowrap;
}

.hearts{
    font-size:40px;
    margin-bottom:30px;
}

.button{
    display:inline-block;
    text-decoration:none;
    padding:18px 60px;
    border-radius:50px;
    background:linear-gradient(to right,#60A5FA,#2563EB);
    color:white;
    font-size:1.3rem;
    font-weight:600;
    box-shadow:0 8px 20px rgba(37,99,235,0.3);
    transition:0.3s;
}

.button:hover{
    transform:translateY(-3px);
}

</style>
</head>

<body>

<div class="card">

<img src="IMG_20260614_105733.jpg" class="penguin">

<h1 class="title">A Special Surprise Awaits!</h1>

<div class="hearts">❤️❤️</div>

<a href="page2.html" class="button">
    Start Surprise 🎁
</a>

</div>

</body>
</html>
